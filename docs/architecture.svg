<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c78a8"/>
    </marker>
  </defs>
  <rect width="1120" height="610" fill="#ffffff"/>

  <!-- pc + uart -->
  <rect x="16" y="236" width="112" height="88" rx="4" fill="#eef4fb" stroke="#4c78a8" stroke-width="1.5"/>
  <text x="72" y="268" text-anchor="middle" font-weight="bold">PC</text>
  <text x="72" y="288" text-anchor="middle" font-size="12">soc_uart.py</text>
  <text x="72" y="306" text-anchor="middle" font-size="11" fill="#555">elf loader</text>

  <g fill="#f7f7f7" stroke="#444" stroke-width="1.3">
    <rect x="160" y="178" width="100" height="40" rx="3"/>
    <rect x="160" y="342" width="100" height="40" rx="3"/>
  </g>
  <text x="210" y="203" text-anchor="middle">uart_rx</text>
  <text x="210" y="367" text-anchor="middle">uart_tx</text>
  <text x="140" y="160" font-size="11" fill="#555">1 Mbaud, onboard USB-UART</text>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <path d="M72,236 L72,198 L158,198" marker-end="url(#a)"/>
    <path d="M158,362 L72,362 L72,326" marker-end="url(#a)"/>
    <path d="M260,198 L296,198" marker-end="url(#a)"/>
    <path d="M296,362 L262,362" marker-end="url(#a)"/>
  </g>

  <!-- loader -->
  <rect x="298" y="150" width="160" height="250" rx="4" fill="#f7f7f7" stroke="#444" stroke-width="1.3"/>
  <text x="378" y="174" text-anchor="middle" font-weight="bold">host_link</text>
  <text x="378" y="191" text-anchor="middle" font-size="11" fill="#555">(the loader)</text>
  <g font-size="11.5" fill="#333">
    <text x="310" y="218">W  write memory</text>
    <text x="310" y="237">R  read it back</text>
    <text x="310" y="256">G  run from pc, with</text>
    <text x="326" y="272">a clock limit</text>
    <text x="310" y="296">cpu stays in reset</text>
    <text x="310" y="312">until G</text>
    <text x="310" y="336">at the end: exit code</text>
    <text x="310" y="352">+ clocks back to the PC</text>
    <text x="310" y="376">while it runs, the pins</text>
    <text x="310" y="392">belong to the uart block</text>
  </g>

  <!-- core -->
  <rect x="500" y="40" width="270" height="176" rx="4" fill="#fff4e8" stroke="#e07b00" stroke-width="1.6"/>
  <text x="635" y="64" text-anchor="middle" font-weight="bold">rv_core: 5 stage RV32I</text>
  <g fill="#ffffff" stroke="#e07b00" stroke-width="1.2">
    <rect x="514" y="78" width="44" height="30" rx="3"/>
    <rect x="565" y="78" width="44" height="30" rx="3"/>
    <rect x="616" y="78" width="44" height="30" rx="3"/>
    <rect x="667" y="78" width="44" height="30" rx="3"/>
    <rect x="718" y="78" width="44" height="30" rx="3"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="bold">
    <text x="536" y="98">IF</text><text x="587" y="98">ID</text><text x="638" y="98">EX</text>
    <text x="689" y="98">MEM</text><text x="740" y="98">WB</text>
  </g>
  <g font-size="11.5" fill="#333">
    <text x="514" y="132">Zicsr, m-mode traps, timer interrupt</text>
    <text x="514" y="150">forwarding MEM / WB -> EX</text>
    <text x="514" y="168">jal + backward branches taken in ID</text>
    <text x="514" y="186">stores, csr writes, traps all in EX</text>
    <text x="514" y="204">io / sdram: axi master in MEM</text>
  </g>
  <text x="380" y="132" font-size="11" fill="#555">reset, start pc</text>
  <path d="M458,140 L498,140" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- block ram -->
  <rect x="500" y="262" width="150" height="92" rx="4" fill="#eef4fb" stroke="#4c78a8" stroke-width="1.5"/>
  <text x="575" y="286" text-anchor="middle" font-weight="bold">block ram 64 KB</text>
  <text x="575" y="304" text-anchor="middle" font-size="11.5">0x0000_0000</text>
  <text x="575" y="322" text-anchor="middle" font-size="11" fill="#555">port a: fetch</text>
  <text x="575" y="338" text-anchor="middle" font-size="11" fill="#555">port b: load / store</text>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <path d="M536,216 L536,260" marker-end="url(#a)"/>
    <path d="M630,216 L630,260" marker-end="url(#a)"/>
  </g>
  <text x="508" y="244" font-size="10.5" fill="#555">IF</text>
  <text x="602" y="244" font-size="10.5" fill="#555">EX</text>

  <!-- fetch buffer -->
  <rect x="672" y="262" width="110" height="60" rx="4" fill="#f7f7f7" stroke="#444" stroke-width="1.3"/>
  <text x="727" y="286" text-anchor="middle">fetch buffer</text>
  <text x="727" y="304" text-anchor="middle" font-size="11" fill="#555">1 line, 16 bytes</text>
  <path d="M727,216 L727,260" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="733" y="244" font-size="10.5" fill="#555">code in sdram</text>

  <!-- loader paths -->
  <g stroke="#4c78a8" stroke-width="1.5" fill="none" stroke-dasharray="5,3">
    <path d="M458,310 L498,310" marker-end="url(#ab)"/>
    <path d="M378,400 L378,520 L614,520" marker-end="url(#ab)"/>
  </g>
  <text x="392" y="540" font-size="11" fill="#4c78a8">loads programs (cpu in reset)</text>

  <!-- xbar -->
  <rect x="820" y="40" width="54" height="440" rx="4" fill="#efe9f7" stroke="#7b5ea7" stroke-width="1.5"/>
  <text x="847" y="260" text-anchor="middle" font-weight="bold" transform="rotate(-90 847 260)">AXI4-Lite interconnect (axil_xbar)</text>
  <path d="M770,180 L818,180" stroke="#333" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <text x="776" y="172" font-size="10.5" fill="#555">master</text>

  <!-- slaves -->
  <g fill="#f7f7f7" stroke="#444" stroke-width="1.3">
    <rect x="910" y="40" width="194" height="64" rx="3"/>
    <rect x="910" y="124" width="194" height="64" rx="3"/>
    <rect x="910" y="208" width="194" height="76" rx="3" fill="#fff4e8" stroke="#e07b00"/>
    <rect x="910" y="304" width="194" height="64" rx="3"/>
    <rect x="910" y="388" width="194" height="64" rx="3"/>
  </g>
  <g font-size="12">
    <text x="922" y="62" font-weight="bold">uart</text><text x="1092" y="62" text-anchor="end" font-size="10.5" fill="#555">0x1000_0000</text>
    <text x="922" y="82" font-size="11">16 byte tx / rx fifos</text>
    <text x="922" y="146" font-weight="bold">timer</text><text x="1092" y="146" text-anchor="end" font-size="10.5" fill="#555">0x1000_1000</text>
    <text x="922" y="166" font-size="11">64 bit mtime / mtimecmp</text>
    <text x="922" y="230" font-weight="bold">fft accelerator</text><text x="1092" y="230" text-anchor="end" font-size="10.5" fill="#555">0x1000_2000</text>
    <text x="922" y="250" font-size="11">256 points, 16 bit, from 03-fft</text>
    <text x="922" y="268" font-size="11">1029 clocks per fft</text>
    <text x="922" y="326" font-weight="bold">sys</text><text x="1092" y="326" text-anchor="end" font-size="10.5" fill="#555">0x1000_3000</text>
    <text x="922" y="346" font-size="11">leds, exit code, clock</text>
    <text x="922" y="410" font-weight="bold">sdram_axi</text><text x="1092" y="410" text-anchor="end" font-size="10.5" fill="#555">0x8000_0000</text>
    <text x="922" y="430" font-size="11">loads / stores into the sdram</text>
  </g>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <path d="M874,72 L908,72" marker-end="url(#a)"/>
    <path d="M874,156 L908,156" marker-end="url(#a)"/>
    <path d="M874,246 L908,246" marker-end="url(#a)"/>
    <path d="M874,336 L908,336" marker-end="url(#a)"/>
    <path d="M874,420 L908,420" marker-end="url(#a)"/>
  </g>

  <!-- timer irq -->
  <path d="M1007,124 L1007,114 L1112,114 L1112,22 L700,22 L700,38" stroke="#e07b00" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#ao)"/>
  <text x="900" y="16" font-size="11" fill="#e07b00">timer interrupt</text>

  <!-- uart bytes -->
  <path d="M910,96 L890,96 L890,12 L240,12 L240,176" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="3,3"/>
  <text x="250" y="30" font-size="11" fill="#777">uart bytes while a program runs (printf)</text>

  <!-- sdram -->
  <rect x="616" y="490" width="200" height="66" rx="4" fill="#f7f7f7" stroke="#444" stroke-width="1.3"/>
  <text x="716" y="514" text-anchor="middle" font-weight="bold">sdram_ctrl</text>
  <text x="716" y="532" text-anchor="middle" font-size="11" fill="#555">2 ports, burst of 4 reads,</text>
  <text x="716" y="547" text-anchor="middle" font-size="11" fill="#555">refresh every 256 clocks</text>
  <path d="M727,322 L727,488" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M1007,452 L1007,523 L818,523" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="862" y="560" width="200" height="40" rx="4" fill="#eef4fb" stroke="#4c78a8" stroke-width="1.5"/>
  <text x="962" y="585" text-anchor="middle">8 MB sdram in the GW2AR-18</text>
  <path d="M760,556 L760,580 L860,580" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
</svg>
