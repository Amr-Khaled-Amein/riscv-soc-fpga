name: sim

on: [push, pull_request]

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: install icarus, numpy, risc-v gcc
        run: sudo apt-get update && sudo apt-get install -y iverilog python3-numpy gcc-riscv64-unknown-elf
      - name: run tests (model, directed, random, act4, c programs, uart top level, mutants)
        run: python3 tools/run_tests.py --random 100
